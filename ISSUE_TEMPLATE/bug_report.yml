name: Bug report
description: Something on the website, in the brand files or elsewhere in the organisation doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Somebody was always going to find it, and we'd rather it was you than a stranger on the internet with a screenshot. Please search the existing issues in this repository first, and report security vulnerabilities through the [security policy](https://github.com/LeanMeanCleanApps/.github/blob/main/SECURITY.md) instead.

        Found a bug in one of the templates themselves? Each template has its own bug form, so open it in that template's repository, where it'll get the attention it so richly deserves: [Minimal API](https://github.com/LeanMeanCleanApps/CleanMinimalApi/issues/new/choose), [Model Context Protocol](https://github.com/LeanMeanCleanApps/CleanModelContextProtocol/issues/new/choose), [GraphQL](https://github.com/LeanMeanCleanApps/CleanGraphQLApi/issues/new/choose), [Web API](https://github.com/LeanMeanCleanApps/CleanWebApi/issues/new/choose) or [Lambda Function](https://github.com/LeanMeanCleanApps/CleanLambdaFunction/issues/new/choose).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The page, file or command, and what you did. "It doesn't work" is a feeling, not a reproduction.
      placeholder: |
        1. Go to https://leanmeanclean.dev/...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead. Reasonable expectations only, please.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: If it's on the website, which browser and device? "My phone" narrows it down to roughly seven billion.
      placeholder: "Firefox 140 on Windows 11, Safari on iOS 26"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any error messages or console output. This is rendered as code, so no backticks are needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I agree to follow this project's [code of conduct](https://github.com/LeanMeanCleanApps/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
