name: Accessibility barrier
description: Something on the website, in the docs or in a template got in your way. We'd like to fix that.
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. If something stopped you reading the docs or using a template, it's our problem to fix, not yours to work around.

        You don't need to know any WCAG success criteria by number, and you don't need to tell us anything about yourself. Where it happened and what got in the way is plenty. You'll hear back within 7 days. The [accessibility statement](https://leanmeanclean.dev/accessibility/) says what we aim for and what happens next.
  - type: input
    id: where
    attributes:
      label: Where was it?
      description: A link to the page, or the template and the tool, like "Clean GraphQL API, the Nitro IDE".
      placeholder: https://leanmeanclean.dev/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What got in the way?
      description: What you were trying to do, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does it get in the way?
      options:
        - I can't get past it
        - I can get past it, but it's hard work
        - It's annoying, but I can carry on
        - Not sure
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What were you using?
      description: Optional, but it helps us reproduce it. The browser, any assistive technology (screen reader, magnifier, voice control, keyboard only), zoom level or system settings like high contrast or reduced motion.
      placeholder: Firefox 140 on Windows 11 with NVDA, zoomed to 200%
  - type: dropdown
    id: upstream
    attributes:
      label: Is it in a tool the templates ship but we don't build?
      description: We can't fix these ourselves, but we'll pass it on to the people who can and look for a workaround in the meantime.
      options:
        - "No, it's on the website or in the template itself"
        - Scalar (Minimal API, Web API)
        - Nitro (GraphQL API)
        - MCP Inspector or Open WebUI (Model Context Protocol)
        - Aspire dashboard
        - Not sure
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: false
